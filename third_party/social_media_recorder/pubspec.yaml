name: social_media_recorder
description: A Flutter package for both android and iOS which provides  Audio recorder from microphone to a given file path through Button to record voice like social media Button
version: 1.2.1
homepage: https://github.com/Subhi-Khalife/social_media_recorder

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  permission_handler: ^11.0.0
  animated_text_kit: ^4.2.2
  path_provider: ^2.1.1
  provider: ^6.1.1
  # v5 pulls record_linux 0.7.2, which does not implement startStream /
  # hasPermission(request:) from record_platform_interface 1.6.x.
  record: ^6.2.0

dependency_overrides:
  record_linux: 1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^1.0.0


# The following section is specific to Flutter.
flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/
  #   - images/a_dot_ham.jpeg

